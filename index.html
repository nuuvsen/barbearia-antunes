<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barbearia Antunes</title>
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <link rel="manifest" href="/manifest.json" />
    
    <meta name="theme-color" content="#000000" />
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Antunes">
    <link rel="apple-touch-icon" href="/icon-192x192.png">

    <script>
      (function () {
        if (window.location.pathname.indexOf('/barbeiro') === 0) {
          var manifestLink = document.querySelector("link[rel~='manifest']");
          if (manifestLink) manifestLink.setAttribute('href', '/manifest-barbeiro.json');

          var appleTitle = document.querySelector("meta[name='apple-mobile-web-app-title']");
          if (appleTitle) appleTitle.setAttribute('content', 'Antunes Team');

          document.title = 'Antunes Team';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
