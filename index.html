<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barbearia Antunes</title>
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <link rel="manifest" href="/manifest.json" />
    
    <meta name="theme-color" content="#000000" />
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Antunes">
    <link rel="apple-touch-icon" href="/icon-192x192.png">

    <script>
      (function () {
        // Dois PWAs instaláveis neste projeto: o do cliente (domínio principal,
        // antunes.nuuvsen.com.br) e o do barbeiro (subdomínio próprio,
        // teamantunes.nuuvsen.com.br) — cada um com seu manifest.json.
        // Usamos um subdomínio dedicado pro barbeiro porque o Chrome/Android não
        // separa direito dois apps instaláveis numa MESMA origem (mesmo em
        // caminhos diferentes) — só um fica instalado por vez. A checagem por
        // caminho (/barbeiro) fica mantida também, só por compatibilidade com
        // links antigos que ainda apontam pro domínio principal.
        var ehDominioBarbeiro = window.location.hostname === 'teamantunes.nuuvsen.com.br';
        var ehCaminhoBarbeiro = window.location.pathname.indexOf('/barbeiro') === 0;

        if (ehDominioBarbeiro || ehCaminhoBarbeiro) {
          var manifestLink = document.querySelector("link[rel~='manifest']");
          if (manifestLink) manifestLink.setAttribute('href', '/manifest-barbeiro.json');

          var appleTitle = document.querySelector("meta[name='apple-mobile-web-app-title']");
          if (appleTitle) appleTitle.setAttribute('content', 'Antunes Team');

          document.title = 'Antunes Team';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
